services:
  - type: web
    name: cornhouse
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: cornhouse-db
          property: connectionString

databases:
  - name: cornhouse-db
    databaseName: cornhouse
    user: cornhouse_user
