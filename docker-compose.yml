services:
  db:
    image: postgres:16-alpine
    container_name: cornhouse-db
    environment:
      POSTGRES_DB: cornhouse
      POSTGRES_USER: cornhouse
      POSTGRES_PASSWORD: cornhouse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cornhouse -d cornhouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cornhouse-web
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-secret-key
      DATABASE_URL: postgres://cornhouse:cornhouse@db:5432/cornhouse
      ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
